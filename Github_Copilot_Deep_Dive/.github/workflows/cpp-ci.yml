name: C++ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build clang-format

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(find include src tests -type f \( -name '*.hpp' -o -name '*.cpp' \) -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ files found to lint."
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"
